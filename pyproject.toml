[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktree-lease"
version = "1.1.0"
description = "Dependency-free Git worktree lease manager — bind worktrees to threads with safe TTL recovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Exis Z", email = "gotexis@users.noreply.github.com" },
]
keywords = ["git", "worktree", "cli", "devtools", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/exisz/worktree-lease"
Repository = "https://github.com/exisz/worktree-lease"
Issues = "https://github.com/exisz/worktree-lease/issues"
Changelog = "https://github.com/exisz/worktree-lease/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
worktree-lease = "worktree_lease.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worktree_lease"]

[tool.pytest.ini_options]
testpaths = ["tests"]
